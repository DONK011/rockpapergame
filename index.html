<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tosh - Qaychi - Qog'oz | AI ga qarshi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow"></div>

<div class="container">

  <header>
    <h1>Tosh <span>·</span> Qaychi <span>·</span> Qog'oz</h1>
    <p class="subtitle">AI'ga qarshi jang qiling</p>
  </header>

  <div class="scoreboard">
    <div class="score-card you">
      <span class="label">SIZ</span>
      <span id="player-score" class="value">0</span>
    </div>
    <div class="score-card round">
      <span class="label">RAUND</span>
      <span id="round-count" class="value">0</span>
    </div>
    <div class="score-card ai">
      <span class="label">AI</span>
      <span id="ai-score" class="value">0</span>
    </div>
  </div>

  <div class="arena">
    <div class="fighter you-side">
      <div id="player-hand" class="hand-display">❓</div>
      <span class="fighter-name">Siz</span>
    </div>

    <div class="vs-badge">
      <span id="result-text">TANLANG</span>
    </div>

    <div class="fighter ai-side">
      <div id="ai-hand" class="hand-display">🤖</div>
      <span class="fighter-name">AI</span>
    </div>
  </div>

  <div class="choices">
    <button class="choice-btn" data-choice="rock">
      <span class="emoji">✊</span>
      <span class="choice-label">Tosh</span>
    </button>
    <button class="choice-btn" data-choice="paper">
      <span class="emoji">✋</span>
      <span class="choice-label">Qog'oz</span>
    </button>
    <button class="choice-btn" data-choice="scissors">
      <span class="emoji">✌️</span>
      <span class="choice-label">Qaychi</span>
    </button>
  </div>

  <button id="reset-btn" class="reset-btn hidden">↻ Hisobni tozalash</button>

  <div id="history" class="history"></div>

</div>

<script src="script.js"></script>
</body>
</html>
